<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>locked — 3d</title>
  <meta name="description" content="3d models made in blender, viewable in the browser">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">locked</span><span class="sub">3d</span></div>
    <div class="top-right"><span id="count" class="muted"></span><span class="muted hint">drop a .glb anywhere to view it</span></div>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <canvas id="view"></canvas>

      <div class="tools">
        <button class="tool" id="t-rotate" title="auto-rotate (A)">⟳</button>
        <button class="tool" id="t-wire" title="wireframe (W)">▦</button>
        <button class="tool" id="t-light" title="lighting (L)">☀</button>
        <button class="tool" id="t-grid" title="floor grid (G)">#</button>
        <button class="tool" id="t-reset" title="reset view (R)">⌖</button>
        <button class="tool" id="t-shot" title="save screenshot">⇩</button>
        <button class="tool" id="t-full" title="fullscreen (F)">⛶</button>
      </div>
      <div class="light-name" id="light-name"></div>

      <div class="transport" id="transport" hidden>
        <button class="play" id="play" title="play / pause (space)">❚❚</button>
        <input type="range" id="scrub" min="0" max="1000" value="0">
        <span class="time" id="time">0.0 / 0.0 s</span>
        <select id="speed" title="speed">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
          <option value="1" selected>1×</option><option value="2">2×</option>
        </select>
      </div>

      <div class="loading" id="loading" hidden><div class="bar"><i id="bar"></i></div><span id="load-txt">loading</span></div>
      <div class="drop" id="drop" hidden><span>drop to view</span></div>
      <div class="error" id="error" hidden></div>
    </section>

    <aside class="side">
      <div class="info" id="info">
        <h1 id="m-name">—</h1>
        <p id="m-desc" class="muted"></p>
        <dl class="stats" id="m-stats"></dl>
      </div>
      <h2 class="label">models</h2>
      <ul class="list" id="list"></ul>
    </aside>
  </main>

  <script type="module" src="js/viewer.js"></script>
</body>
</html>
