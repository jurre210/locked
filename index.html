<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>locked · how good are you, really</title>
<meta name="description" content="A pile of tiny games that measure how dialed in you actually are.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><circle cx='50' cy='50' r='26' fill='none' stroke='%23fff' stroke-width='8'/><circle cx='50' cy='50' r='6' fill='%23fff'/></svg>">
</head>
<body>
  <div id="shell">
    <header id="top">
      <a class="brand" href="#/" data-nav>locked</a>
      <div class="crumbs" id="crumb"></div>
      <div class="topright">
        <button class="tbtn" id="btn-sound" title="Sound on/off">sound</button>
        <button class="tbtn" id="btn-stats" title="Your record">record</button>
        <button class="tbtn" id="btn-random" title="Random game">random</button>
      </div>
    </header>

    <main id="view"></main>

    <footer id="dock"></footer>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <button class="modal-x" id="modal-x">esc</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
